[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "london-cycleflow"
version = "0.1.0"
description = "TfL cycle-hire demand forecasting, physical constraints and Data Observatory visualisation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "flake8>=7", "black>=24"]

[project.scripts]
cycleflow = "cycleflow.cli:main"

[tool.setuptools.packages.find]
include = ["cycleflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
